<p id="about" contenteditable="true" spellcheck="false">I work as a leasing administrator. In my spare time I make fonts, including the one you&#8217;re reading now. Type here to try it.</p>

<p>It&#8217;s called Dirigible One, coming soon. There are more at <a href="https://michaelsfonts.com">michaelsfonts.com</a>.</p>

<p>Email me at <a href="mailto:mail@michaelseh.com">mail@michaelseh.com</a> if you&#8217;d like to get in touch.</p>

<script>
(function () {
	var about = document.getElementById('about');
	if (!about) return;
	if (!window.matchMedia || !window.matchMedia('(pointer: fine)').matches) return;
	about.focus({ preventScroll: true });
	var range = document.createRange();
	range.selectNodeContents(about);
	range.collapse(false);
	var sel = window.getSelection();
	sel.removeAllRanges();
	sel.addRange(range);
})();
</script>
