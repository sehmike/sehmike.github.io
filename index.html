	<script>
	(function () {
		var intro = document.getElementById('intro');
		if (!intro) return;
		intro.focus({ preventScroll: true });
		var range = document.createRange();
		range.selectNodeContents(intro);
		range.collapse(false);
		var sel = window.getSelection();
		sel.removeAllRanges();
		sel.addRange(range);
