<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
	<title>Michael Seh</title>
	<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
	<meta name="description" content="Michael Seh is a type designer based in Los Angeles, CA." />
	<meta name="keywords" content="Type Design, Michael, Seh, Typography, Type, MichaelSeh, LA, Los Angeles" />
	<meta name="author" content="Michael, Seh, MichaelSeh" />
	<meta name="viewport" content="width=device-width">
	<link rel="stylesheet" href="css/main.css">
</head>


<body>

		<div class="main">

				<p class="intro">I work as a leasing administrator. In my spare time I make fonts, including the one you&#8217;re reading now. My email is below if you&#8217;d like to get in touch.</p>

				<p class="contact"><a class="txt" id="email" href="mailto:mail@michaelseh.com" data-email="mail@michaelseh.com">mail@michaelseh.com</a></p>

		</div>

	<script type="text/javascript">
	(function () {
		var link = document.getElementById('email');
		if (!link) return;
		var original = link.textContent;
		var timer;
		link.addEventListener('click', function (e) {
			var email = link.getAttribute('data-email');
			if (navigator.clipboard && navigator.clipboard.writeText) {
				e.preventDefault();
				navigator.clipboard.writeText(email).then(function () {
					link.textContent = 'copied';
					clearTimeout(timer);
					timer = setTimeout(function () { link.textContent = original; }, 1500);
				}).catch(function () {
					window.location.href = 'mailto:' + email;
				});
			}
			// no clipboard support: fall through to the mailto: href
		});
	})();
	</script>

</body>
</html>
